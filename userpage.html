<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Website</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <script src = '../static/js/script.js'></script>
    <style>
        body {
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 0;
            background: url('b1.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }


        .profile-container {
            position: relative;
            display: inline-block;
        }

        .profile {
            cursor: pointer;
            background-color: #f08c09;
            color: white;
            padding: 10px;
            border-radius: 50%;
            text-align: center;
            font-size: 16px;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: -30px;
            transform: translateX(-10%);
            background-color: rgba(255, 255, 255, 0.9);
            color: black;
            border: 1px solid #171717;
            border-radius: 3px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 175px;
            z-index: 1000;
        }

        .dropdown a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .dropdown a:hover {
            background-color: #f5850d;
        }

        .dropdown-text {
            padding: 10px;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #ccc;
            background-color: #f4f4f4;
            font-style: italic;
        }

        /* Middle Section */
        .middle {
            flex: 1;
            text-align: center;
            padding: 50px 20px;
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent background */
            margin: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .movies {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .movie {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 15px;
            width: 200px;
            text-align: center;
        }

        .start-review-btn {
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .start-review-btn:hover {
            background-color: #0056b3;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            height: 50px; /* Ensure this matches the height of the footer */
        }
        

    </style>

    <script>
        function toggleDropdown() {
            const dropdown = document.querySelector(".dropdown");
            dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        }

        function confirmLogout() {
            return confirm("Are you sure you want to log out?");
        }

        window.onclick = function (event) {
            if (!event.target.matches('.profile')) {
                const dropdowns = document.querySelectorAll(".dropdown");
                dropdowns.forEach((dropdown) => {
                    dropdown.style.display = "none";
                });
            }
        };
    </script>
</head>

<body>
    <!-- Navigation Bar -->
    <div class="navbar">
        <img src="..\static\images\logo2.jpg" alt="Website Logo">
        <div>
            <a href="/about">About Us</a>
            <a href="/contact">Contact Us</a>
            <a href="/helpline">Helpline</a>
            <div class="profile-container">
                <div class="profile" onclick="toggleDropdown()">👤</div>
                <div class="dropdown">
                    <div class="dropdown-text">Your Profile Options</div>
                    <a href="/yourreview">Your Reviews</a>
                    <a href="/settings">Settings</a>
                    <a href="/" onclick="return confirmLogout()">Logout</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Middle Section -->
    <!-- Inside your body, where you render the movie cards -->
    <div class="container mt-5">
        <div class="row row-cols-1 row-cols-md-4 g-4" id="movie-cards-container">
            <!-- Cards will be dynamically inserted here -->
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Movie Review Website. All Rights Reserved.</p>
    </footer>
</body>

</html>
