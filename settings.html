<!DOCTYPE html>
<html lang="en">

<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; 
            padding: 0;
            background: url("b1.jpg") no-repeat center center fixed;
            background-size: cover;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .settings-container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.9); /* Semi-transparent white */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }

        .settings-container h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .settings-container form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-group input[type="file"] {
            padding: 5px;
        }

        .profile-picture {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-picture img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 20px;
        }

        .save-button {
            background-color: #2193b0;
            color: white;
            padding: 12px 20px;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .save-button:hover {
            background-color: #176885;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            height: 50px; /* Ensure this matches the height of the footer */
        }
        
    </style>
</head>

<body>
    <div class="navbar">
        <img src="..\static\images\logo2.jpg" alt="Website Logo">
        <div>
            <a href="/userpage">Home</a>
            <a href="/about">About Us</a>
            <a href="/contact">Contact Us</a>
            <a href="/helpline">Helpline</a>
        </div>
    </div>

    <div class="settings-container">
        <h1>Settings</h1>
        <form action="/update_settings" method="POST" enctype="multipart/form-data">
            <!-- Profile Picture Section -->
            <div class="profile-picture">
                <img src="../static/images/profile.jpg" alt="Profile Picture" id="profilePreview">
                <div>
                    <label for="profilePicture">Change Photo</label>
                    <br>
                    <input type="file" id="profilePicture" name="profilePicture" accept="image/*" onchange="previewImage(event)">
                </div>
            </div>

            <!-- Username Section -->
            <div class="form-group">
                <label for="username">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your new email" required>
            </div>

            <!-- Email Section -->
            <div class="form-group">
                <label for="email">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <!-- Password Section -->
            <div class="form-group">
                <label for="password">New Password:</label>
                <input type="password" id="newpassword" name="newpassword" placeholder="Enter your new password" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="save-button">Save Changes</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Movie Review Website. All Rights Reserved.</p>
    </footer>
</body>

</html>
