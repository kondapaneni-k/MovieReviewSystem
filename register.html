<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="icon" href="..\static\logo.jpg">
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Same styles as your original code */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('b1.jpg'); /* Set b1.jpg as the background image */
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Keeps the background fixed during scrolling */
            background-position: center; /* Centers the background image */
        }
        .navbar { 
            width: 100%;
            height: 7%;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px 0;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
        }

        .navbar .logo img {
            height: 65px;
            padding-left: 30px;
        }

        .navbar .links {
            display: flex;
            margin-right: 15px;
        }

        .navbar a {
            color: #f9a602;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            padding: 10px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .navbar a:hover {
            background-color: #e9ecef;
            color: black;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: 700;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #333;
            text-transform: uppercase;
        }
        input[type="text"],
        input[type="date"],
        input[type="file"] {
            width: calc(100% - 12px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        input[type="radio"] {
            display: none;
        }
        input[type="radio"] + label {
            display: inline-block;
            padding: 8px 15px;
            margin-right: 10px;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="radio"]:checked + label {
            background-color: #333;
            color: #fff;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #e97613;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }
        .submit-btn:hover {
            background-color: #555;
        }
        .terms {
            margin-top: 20px;
            font-size: 14px;
        }
        a {
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }
        .note {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
        span {
            color: red;
        }
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(61, 14, 203, 0.1);
            z-index: 9999;
            width: 500px;
            height: 300px;
        }
        .popup-container {
            text-align: center;
        }
        .popup button {
            padding: 10px 20px;
            background-color: #4CAF50; 
            color: white;
            border: none;
            cursor: pointer;
            margin: 20px;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9998;
        }
        /*footer section*/
        footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="../static/images/logo2.jpg" alt="Company Logo">
        </div>
        <div class="links">
            <a href="/">login Here</a>
        </div>
    </div>

    <div class="container">
        <h2>Registration Form</h2>
        <form id="registrationForm" autocomplete="off">
            <div class="form-group">
                <label for="firstName">First Name<span>*</span></label>
                <input type="text" id="firstName" name="firstname" placeholder="Enter your first name" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name<span>*</span></label>
                <input type="text" id="lastName" name="lastname" placeholder="Enter your last name" required>
            </div>
            <div class="form-group">
                <label>Gender<span>*</span></label>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="others" name="gender" value="others">
                <label for="others">Others</label>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth<span>*</span></label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label for="Gmail">Gmail<span>*</span></label>
                <input type="text" id="Gmail" name="username" placeholder="Enter your Gmail id" required>
            </div>
            <div class="form-group">
                <label for="Password">Password<span>*</span></label>
                <input type="text" id="Password" name="password" placeholder="Enter your new password" required>
            </div>
            <div class="form-group">
                <p class="terms">View our <a href="/terms">Terms and Conditions</a></p>
            </div>
            <div class="form-group">
                <input type="checkbox" id="termsAgree" required>
                <label for="termsAgree">I have read and agree to all terms and conditions of the company</label>
            </div>
            <button type="button" id="submit-btn" onclick="redirectToLogin()" class="submit-btn">Register</button>
            <p class="note">Fields marked with <span>*</span> are mandatory</p>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Movie Review Website. All Rights Reserved.</p>
    </footer>

    <script>
        // Function to handle the form submission
        document.getElementById('submit-btn').addEventListener('click', function(event) {
            event.preventDefault(); // Prevent the default form submission
    
            // Get form values
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const gender = document.querySelector('input[name="gender"]:checked') ? document.querySelector('input[name="gender"]:checked').value : '';
            const dob = document.getElementById('dob').value;
            const email = document.getElementById('Gmail').value;
            const password = document.getElementById('Password').value;
            const termsAgree = document.getElementById('termsAgree').checked;
    
            // Validate the form
            if (!firstName || !lastName || !gender || !dob || !email || !password) {
                alert('Please fill all the mandatory fields.');
                return;
            }
    
            if (!termsAgree) {
                alert('You must agree to the terms and conditions.');
                return;
            }
    
            // Prepare data to be sent to the server
            const userData = {
                firstName: firstName,
                lastName: lastName,
                gender: gender,
                dob: dob,
                email: email,
                password: password
            };
    
            fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message); // Show success message
                    window.location.href = '/'; // Redirect to login page
                } else {
                    alert('Registration failed: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            });
            
        });
    </script>
    
</body>
</html>
